[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcx"
version = "0.1.0"
description = "Connector library for the CoinDCX and CoinSwitch trading APIs. Transport and auth only - no strategy logic."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dcx = "dcx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real exchange endpoints over the network"]
