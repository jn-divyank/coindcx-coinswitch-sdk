name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # The live tests are the only thing that notices an exchange changing a
    # response shape, so run them daily even when nobody pushes.
    - cron: "17 6 * * *"

jobs:
  offline:
    name: tests (offline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run offline tests
        run: pytest -m "not live" -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  live:
    name: tests (live exchange endpoints)
    runs-on: ubuntu-latest
    # Informational: a red build here means an exchange changed something or is
    # having a bad day, not that the pushed code is wrong.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run live tests against public endpoints
        run: pytest -m live -q
